# Layer configuration for meta-bharath
# Custom Yocto layer containing sensor-simulator and netcomm recipes

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bharath"
BBFILE_PATTERN_meta-bharath = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bharath = "6"

LAYERDEPENDS_meta-bharath = "core"
LAYERSERIES_COMPAT_meta-bharath = "scarthgap styhead"
